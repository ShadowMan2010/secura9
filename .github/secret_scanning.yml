push-protection:
  bypass:
    - paths:
        - 'dashboard/web-deck.html'
        - 'dashboard/public/index.html'
      reason: "Firebase Web SDK API key — intentionally public, client-side credential required by Firebase Auth"
    - paths:
        - 'secura9-android/app/google-services.json'
      reason: "Firebase Android SDK config — intentionally public, downloaded from Firebase Console per-device"
